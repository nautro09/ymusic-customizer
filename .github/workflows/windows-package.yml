name: Verify Windows package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download release files and verify signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" -D package -p update.json -p update.sig -p YMusic-Customizer-Windows.zip
          openssl dgst -sha256 -verify shared/update-public.pem -signature package/update.sig package/update.json
      - name: Verify archive and host recovery
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/test-windows-package.ps1 -Directory package -Tag $env:RELEASE_TAG
