name: Verify Windows package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
      payload:
        description: Digest of all files in the signed candidate (before publication)
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce unpublished candidate
        if: inputs.payload != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          gh release download -D previous -p YMusic-Customizer-Windows.zip
          python scripts/stage-windows-check.py previous/YMusic-Customizer-Windows.zip staged "$PAYLOAD"
      - name: Download release files and verify signature
        if: inputs.payload == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" -D package -p update.json -p update.sig -p YMusic-Customizer-Windows.zip
          openssl dgst -sha256 -verify shared/update-public.pem -signature package/update.sig package/update.json
      - name: Verify archive and host recovery
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (Test-Path staged) {
            ./scripts/test-windows-package.ps1 -Staged staged
          } else {
            ./scripts/test-windows-package.ps1 -Directory package -Tag $env:RELEASE_TAG
          }
